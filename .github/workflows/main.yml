name: Generate Snake Animation
on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: aryen1101
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Profile README cards. A separate job so a snake failure can't block them.
  cards:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh contribution data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Written to a temp file first so a failed request never wipes the last good snapshot.
        run: |
          gh api graphql -F query=@scripts/contributions.graphql -f login=aryen1101 > "$RUNNER_TEMP/contributions.json"
          mv "$RUNNER_TEMP/contributions.json" data/contributions.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render cards
        run: |
          pip install fonttools==4.63.0
          python scripts/render_cards.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only the cards decide. The data always differs (it includes this
          # repo's own last-push time), so it rides along with a card change.
          if [ -z "$(git status --porcelain -- cards)" ]; then
            echo "Cards unchanged."
          else
            git add data/contributions.json cards
            git commit -m "Refresh profile cards"
            git push
          fi
